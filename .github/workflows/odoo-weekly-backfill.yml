name: Odoo Weekly Backfill

on:
  workflow_dispatch: {}
  schedule:
    # Monday 00:00 Asia/Jakarta (WIB, UTC+7) = Sunday 17:00 UTC.
    - cron: "0 17 * * 0"

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write .env from secrets
        run: |
          cat <<EOF > .env
          ODOO_URL=${{ secrets.ODOO_URL }}
          ODOO_DB=${{ secrets.ODOO_DB }}
          ODOO_USERNAME=${{ secrets.ODOO_USERNAME }}
          ODOO_PASSWORD=${{ secrets.ODOO_PASSWORD }}
          EOF

      - name: Write GCS credentials from secret
        run: |
          cat <<'EOF' > gcp_key.json
          ${{ secrets.GCP_SA_KEY }}
          EOF

      - name: Run full backfill (every quarter Q1 through today)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp_key.json
        run: python run_full_backfill.py

      - name: Upload exported files (artifact backup)
        uses: actions/upload-artifact@v4
        with:
          name: odoo-weekly-backfill
          path: "*.xlsx"
          retention-days: 30
